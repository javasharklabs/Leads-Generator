<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg0: #030712;
      --bg1: #0c1222;
      --surface: rgba(17, 24, 39, 0.72);
      --stroke: rgba(148, 163, 184, 0.14);
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #2dd4bf;
      --accent-dim: rgba(45, 212, 191, 0.15);
      --maps: linear-gradient(135deg, #14b8a6 0%, #0d9488 50%, #0f766e 100%);
      --jd: linear-gradient(135deg, #fb923c 0%, #ea580c 55%, #c2410c 100%);
      --glow: 0 0 40px rgba(45, 212, 191, 0.12);
      --radius: 14px;
      --radius-sm: 10px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      width: 340px;
      margin: 0;
      padding: 0;
      font-family: "Outfit", system-ui, sans-serif;
      background: var(--bg0);
      color: var(--text);
      min-height: 100%;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: -40%;
      background:
        radial-gradient(ellipse 80% 50% at 20% -10%, rgba(45, 212, 191, 0.18), transparent 55%),
        radial-gradient(ellipse 60% 40% at 100% 0%, rgba(56, 189, 248, 0.1), transparent 50%),
        radial-gradient(ellipse 50% 30% at 50% 110%, rgba(251, 146, 60, 0.06), transparent 45%);
      pointer-events: none;
      z-index: 0;
    }

    .shell {
      position: relative;
      z-index: 1;
      padding: 20px 18px 22px;
    }

    .brand {
      text-align: center;
      margin-bottom: 18px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--stroke);
    }

    .brand-mark {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      margin-bottom: 10px;
      border-radius: 12px;
      background: linear-gradient(145deg, rgba(45, 212, 191, 0.2), rgba(15, 23, 42, 0.9));
      border: 1px solid rgba(45, 212, 191, 0.35);
      box-shadow: var(--glow);
    }

    .brand-mark svg {
      display: block;
    }

    .brand h2 {
      margin: 0 0 6px;
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      background: linear-gradient(90deg, #f8fafc 0%, #99f6e4 45%, #5eead4 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .brand .tag {
      display: inline-block;
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid var(--stroke);
    }

    .input-group {
      margin-bottom: 16px;
    }

    .input-group label {
      display: block;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
    }

    input[type="text"] {
      width: 100%;
      padding: 12px 14px;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--stroke);
      border-radius: var(--radius-sm);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input[type="text"]::placeholder {
      color: #64748b;
    }

    input[type="text"]:focus {
      border-color: rgba(45, 212, 191, 0.5);
      box-shadow: 0 0 0 3px var(--accent-dim);
    }

    .btn-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 14px;
    }

    button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 12px 10px;
      border: none;
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: #fff;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.2s, filter 0.2s;
    }

    #mapsBtn {
      background: var(--maps);
      box-shadow: 0 4px 16px rgba(20, 184, 166, 0.25);
    }

    #jdBtn {
      background: var(--jd);
      box-shadow: 0 4px 16px rgba(234, 88, 12, 0.22);
    }

    button:hover {
      transform: translateY(-1px);
      filter: brightness(1.05);
    }

    button:active {
      transform: translateY(0);
    }

    .console-box {
      display: none;
      margin-bottom: 12px;
      padding: 12px 14px;
      border-radius: var(--radius-sm);
      background: rgba(3, 7, 18, 0.85);
      border: 1px solid var(--stroke);
      font-family: "JetBrains Mono", monospace;
      font-size: 0.65rem;
      line-height: 1.5;
      color: #5eead4;
      min-height: 72px;
      overflow: hidden;
    }

    #loader-bar {
      height: 3px;
      margin-top: 10px;
      border-radius: 999px;
      background: linear-gradient(90deg, #0d9488, #2dd4bf, #5eead4);
      width: 0%;
      transition: width 0.12s ease-out;
    }

    #status-text {
      display: none;
      margin-top: 6px;
      text-align: center;
      font-size: 0.82rem;
      font-weight: 600;
      color: #5eead4;
    }

    .social-links {
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px solid var(--stroke);
      display: flex;
      justify-content: center;
      gap: 12px;
    }

    .social-links a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: var(--surface);
      border: 1px solid var(--stroke);
      color: var(--muted);
      text-decoration: none;
      transition: all 0.2s;
    }

    .social-links a:hover {
      color: var(--accent);
      border-color: var(--accent-dim);
      background: rgba(45, 212, 191, 0.1);
      transform: translateY(-2px);
    }

    .social-links a svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }

    .manage-leads-btn {
      display: block;
      margin-top: 12px;
      text-align: center;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--bg0);
      background: var(--accent);
      padding: 10px;
      border-radius: var(--radius-sm);
      text-decoration: none;
      transition: all 0.2s;
    }

    .manage-leads-btn:hover {
      background: #14b8a6;
      transform: translateY(-1px);
    }
  </style>
</head>

<body>
  <div class="shell">
    <header class="brand">
      <div class="brand-mark" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 14c2-4 6-6 10-6 3 0 5 1 6 3" stroke="#2dd4bf" stroke-width="2" stroke-linecap="round" />
          <path d="M2 12h4l2-3 2 6 3-8 3 5h6" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"
            stroke-linejoin="round" />
        </svg>
      </div>
      <h2>Java Shark Scraper</h2>
      <span class="tag">Leads generator</span>
    </header>

    <div class="input-group">
      <label for="filename">Project / CSV name (Auto-detected if empty)</label>
      <input type="text" id="filename" placeholder="Leave empty to auto-detect" autocomplete="off">
    </div>

    <div class="btn-group">
      <button type="button" id="mapsBtn">Google Maps</button>
      <button type="button" id="jdBtn">JustDial</button>
    </div>

    <div class="console-box" id="console">
      <div id="log-text">System ready…</div>
      <div id="loader-bar"></div>
    </div>

    <div id="status-text"></div>

    <div class="social-links">

        </svg>

      <a href="https://www.youtube.com/@javashark" target="_blank" title="YouTube">

          <path
            d="M21.582 6.186a2.616 2.616 0 0 0-1.84-1.854C18.118 4 12 4 12 4s-6.118 0-7.742.332a2.616 2.616 0 0 0-1.84 1.854C2 7.828 2 12 2 12s0 4.172.418 5.814a2.616 2.616 0 0 0 1.84 1.854C5.882 20 12 20 12 20s6.118 0 7.742-.332a2.616 2.616 0 0 0 1.84-1.854C22 16.172 22 12 22 12s0-4.172-.418-5.814zM10 15.464V8.536L15.933 12 10 15.464z" />

            d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 100 12.324 6.162 6.162 0 000-12.324zM12 16a4 4 0 110-8 4 4 0 010 8zm6.406-11.845a1.44 1.44 0 100 2.881 1.44 1.44 0 000-2.881z" />

    </div>

    <a href="https://javashark.in/tools/lead-manager" target="_blank" class="manage-leads-btn">
      Manage Leads & Updates
    </a>
  </div>

  <script src="popup.js"></script>
</body>

</html>
